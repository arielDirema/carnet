# Crée une release GitHub avec l'APK chaque fois qu'une PR est fusionnée dans main.
name: Release APK

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

permissions:
  contents: read

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write # nécessaire pour créer la release
    steps:
      # Actions épinglées par empreinte de commit (une étiquette peut être déplacée)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Numéro de version
        id: ver
        run: |
          echo "code=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"
          echo "name=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Compiler et signer l'APK (release)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CARNET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CARNET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CARNET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$CARNET_KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets de signature manquants : aucune release publiée."
            exit 1
          fi
          export CARNET_KEYSTORE="$RUNNER_TEMP/carnet-release.jks"
          printf '%s' "$KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > "$CARNET_KEYSTORE"
          trap 'rm -f "$CARNET_KEYSTORE"' EXIT
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"
          APK=app/build/outputs/apk/release/app-release.apk
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$SIGNER" verify --print-certs "$APK" | grep -i "SHA-256" | head -1
          cp "$APK" "$GITHUB_WORKSPACE/Carnet-$VERSION_NAME.apk"

      - name: Publier la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: Carnet ${{ steps.ver.outputs.name }}
          target_commitish: main
          make_latest: true
          body: |
            ${{ github.event.pull_request.title && format('PR #{0} : {1}', github.event.pull_request.number, github.event.pull_request.title) || 'Version compilée manuellement' }}

            Téléchargez `Carnet-${{ steps.ver.outputs.name }}.apk` ci-dessous et ouvrez-le sur la tablette pour l'installer ou le mettre à jour.
          files: Carnet-${{ steps.ver.outputs.name }}.apk
